name: olympic-games-tracker

services:

  front:
    build: .
    image: ${APP_IMAGE:-olympic-games-tracker:local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
